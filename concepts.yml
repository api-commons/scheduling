context: scheduling
name: Calendars and Scheduling
intro: >-
  The common scheduling vocabulary -- calendars, the events on them, the bookings people
  make, the availability they are made against, and the kinds of appointment on offer --
  distilled from the APIs that already exist.
tags: [Scheduling, Calendar]

envelope: [_links, _pagination, _results, data, success, errors, warnings, count, total, page, meta, links,
           value, results, next, previous, has_more, message, status_code, ids, next_page, previous_page,
           page_info, cursor, total_count, per_page, total_pages, current_page, object, url, collection, pagination]

common_fields:
  id: [uuid, guid, object_id, record_id, uri]
  created_at: [created, created_date, created_time, date_created, create_time, creation_date, created_on]
  updated_at: [updated, updated_date, modified_at, last_modified, date_modified, update_time, modified_date, updated_time]
  metadata: [meta_data, custom_fields, custom, attributes, properties, extended_properties]
  status: [state, booking_status, event_status]
  name: [title, display_name, label, summary]
  description: [notes, note, details, body, comments]
  time_zone: [timezone, tz, time_zone_id, iana_timezone]
  start_at: [start, start_time, starts_at, start_date, start_datetime, begin, from, start_date_time]
  end_at: [end, end_time, ends_at, end_date, end_datetime, until, to, end_date_time]

concepts:
  calendar:
    segments: [calendars, calendar]
    aliases:
      owner_id: [owner, user_id, account_id]
      is_primary: [primary, is_default, default]
      color: [background_color, hex_color]
  calendar_event:
    # A bare /events is a webhook feed or a ticketed event elsewhere; here it counts beneath
    # a calendar, or at a provider that also exposes calendars.
    requires: [calendar]
    path: /calendars/{calendar_id}/events
    segments: [events, event, calendar_events, calendar-events]
    aliases:
      attendees: [participants, guests, invitees, members]
      location: [place, address, venue, conferencing, meeting_url, video_url, join_url]
      organizer_id: [organizer, owner, host, creator, created_by]
      is_all_day: [all_day, allday, is_all_day_event]
      recurrence: [rrule, recurrence_rule, recurring, repeat]
      calendar_id: [calendar]
  appointment:
    segments: [appointments, appointment, bookings, booking, scheduled_events, meetings]
    aliases:
      customer_id: [customer, client_id, client, patient_id, contact_id, invitee, attendee, booker]
      staff_id: [staff, provider_id, resource_id, host_id, employee_id, user_id, practitioner_id, team_member_id, assigned_to]
      service_id: [service, event_type_id, event_type, appointment_type_id, appointment_type, service_variation_id]
      location_id: [location, location_name]
      canceled_at: [cancelled_at, cancellation_date, canceled]
      cancellation_reason: [cancel_reason, reason]
      price: [amount, cost, total]
  availability:
    requires: [appointment]
    path: /availability
    segments: [availability, availabilities, free_busy, freebusy, free-busy, slots, time_slots, available_slots, available-times, available_times, openings]
    aliases:
      slots: [times, available_times, availability, intervals, time_slots]
      staff_id: [staff, provider_id, resource_id, user_id]
      service_id: [service, event_type_id, appointment_type_id]
  service:
    # What can be booked: Calendly's event types, Acuity's appointment types, Square's services.
    requires: [appointment]
    segments: [event_types, event-types, eventtypes, appointment_types, appointment-types, appointmenttypes, booking_types, services, service_types]
    aliases:
      duration: [duration_minutes, length, duration_in_minutes, minutes]
      price: [amount, cost, rate]
      slug: [handle, url_slug, scheduling_url]
      is_active: [active, enabled, status, hidden]
      staff_ids: [staff, providers, resources, hosts, users]

exclude:
  service:
    cronitor: /integrations/services are monitoring integrations
    nomad: /allocation/{id}/services are infrastructure services
    gingr: /bookings/{id}/services are add-ons on a pet-care booking, not a bookable type

findings:
  - "Calendar events agree more than anything else here: description, attendees, location,
    start and end, and recurrence are all core -- the iCalendar shape every calendar API
    inherits."
  - "Availability barely agrees: only end_at reaches half of the providers that expose it.
    Some return free/busy blocks, some bookable slots, some opening hours."
  - "The cohort is thin for its size (112 tagged providers, 37 mapped). Most scheduling
    products publish no OpenAPI of their own."
decisions:
  - "The Booking tag is not used: it is mostly travel booking, which has its own context."
  - "An appointment is `/appointments`, not `/bookings`. Appointments lead 16 providers to
    14, and the word collides with nothing in other contexts."
  - "A calendar event is `/calendars/{calendar_id}/events`. A bare `/events` is a webhook
    feed or a ticketed event elsewhere, so here it counts only at a provider that also
    exposes calendars (`requires: [calendar]`)."
  - "What can be booked is a `service` (`/services`), covering Calendly's event types and
    Acuity's appointment types. `services` leads (7) and is the plain word."
  - "Infrastructure `/services` (Nomad, Cronitor) are excluded by name."
